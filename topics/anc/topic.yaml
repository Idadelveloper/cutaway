name: anc
title: How noise-cancelling headphones work
prompt: >
  Explain how active noise-cancelling (ANC) headphones work, from sound as air
  pressure up to the full system: outer (feedforward) microphone, processing chip,
  speaker producing anti-noise, the inner (feedback) microphone, why cancellation
  works on low steady hums but not on voices, passive padding, and transparency mode.
audience: >
  Curious adults with no physics background beyond high school. Comfortable with
  sliders and diagrams, not with equations; equations may appear as optional asides.

field: physics / engineering
for: [teachers, students, hardware documentation teams]
figure_count: [8, 12]
figure_hints:
  - "Sound is air pressure: particles move back and forth without traveling"
  - "Frequency and wavelength"
  - "Two waves add"
  - "Flipping a wave cancels it"
  - "Inside the ear cup: outer mic, chip, speaker"
  - "Delay ruins cancellation at higher pitches"
  - "Why it works on engine hum but not voices, and passive padding"
  - "The inner feedback mic"
  - "Transparency mode"
  - "Everything together"
hero: >
  The whole headphone ear cup; drag to orbit; a slider peels it open into a
  cutaway and exploded view; play/pause.

# Law checks available for this topic (implemented in cutaway/checks/acoustics.py).
# The spec writer picks from these and fills params from cited sources.
law_checks:
  wave_speed:
    text: "frequency x wavelength = speed of sound"
    params: {speed_of_sound_m_s: 343, tolerance: 0.02}
  superposition_add:
    text: "pressure at the ear = noise pressure + anti-noise pressure"
    params: {rel_tolerance: 1.0e-6}
  superposition_cancel:
    text: "with zero delay and ANC on, residual RMS <= 5% of noise RMS below the cutoff frequency"
    params: {max_ratio: 0.05, cutoff_hz: 1000}
  delay_residual:
    text: "with delay tau, residual/noise RMS ~= 2|sin(pi f tau)|"
    params: {tolerance: 0.10}
  phase_flip:
    text: "anti-noise is the inverted noise signal when delay is 0 (correlation <= -0.95)"
    params: {max_corr: -0.95}
  particles_oscillate:
    text: "air particles oscillate about a fixed mean position; displacement is bounded"
    params: {max_disp: 1.0, max_drift: 0.05}
  controls_affect_probes:
    text: "each physics control changes at least one measured probe"
    params: {}

# Probe names the model/page should expose (getState().probes)
probes:
  - p_noise_ear
  - p_anti_ear
  - p_total_ear
  - particle_disp_max
  - frequency_hz
  - wavelength_m
  - delay_s
  - residual_ratio

# Requirements for model.js (what the law checks measure). Use cited spec values for constants.
model_notes: |
  - Noise at the ear: p_noise_ear(t) = A * sin(2*pi*f*t), A = amplitude control (default 1).
  - Anti-noise at the ear: p_anti_ear(t) = -g * A * sin(2*pi*f*(t - tau)) when ANC is on, else 0.
    tau = delay_s control (processing + acoustic latency), g = anti-noise gain (default 1).
  - p_total_ear = p_noise_ear + p_anti_ear exactly (computed as that sum, no smoothing).
  - Passive padding attenuates p_noise_ear by a frequency-dependent factor from the spec (more at high f).
  - Feedback (inner) mic: reduces the residual further by a loop gain factor from the spec, below its cutoff.
  - Transparency mode: anti-noise off, and the outer mic signal is played through (p_total ~ unattenuated noise).
  - Wavelength: wavelength_m = c / f with c = 343 m/s (or the spec's cited value); expose frequency_hz and wavelength_m.
  - Air particles: displacement of particle i = d_max * sin(2*pi*f*t - k*x_i), k = 2*pi/wavelength; rest positions fixed.
    Expose particle_disp_max (max |displacement| this frame) and particle_mean_offset (mean displacement across particles).
  - residual_ratio = RMS(p_total_ear)/RMS(p_noise_ear) over the last full period (analytic is fine).
  - Use simulated time t from advance(dt) only; at audio frequencies show the wave slowed down with a visible
    "time slowed x N" factor, but compute probes at the true physical frequency f and simulated time t / N.
  - Expose t_phys_s (the physical time the probes were computed at) and time_scale (N) as probes, so checks can
    reconstruct the waveform exactly.

palette:
  grey: "#c9ccd1"
  ink: "#22252a"
  noise: "#e0533d"
  anti: "#2f7de1"
  total: "#7b4fd6"
  mic: "#1fa37a"
  chip: "#e3a21a"
  speaker: "#d64f9a"
  air: "#8fb8de"
  padding: "#9c7a5b"

spec_notes: |
  - Figures that show waves at the ear expose p_noise_ear, p_anti_ear, p_total_ear and list the superposition laws.

source_mix:
  - papers (open access preferred) and patents on active noise control in headphones
  - standards and manufacturer/engineering docs (application notes, white papers from chip and headphone makers)
  - quality technical articles (engineering magazines, university pages, acoustics societies)

research_focus:
  - speed of sound and wavelength; superposition and phase inversion
  - feedforward vs feedback microphones; processing latency and its effect on cancellation vs frequency
  - typical ANC and passive attenuation (dB) by frequency band; transparency / hear-through mode

scout_checks:
  - for a sine of frequency f and delay tau, RMS(noise + inverted delayed noise)/RMS(noise) = 2|sin(pi f tau)|
  - f * wavelength = 343 m/s for f in 100, 1000, 5000 Hz
